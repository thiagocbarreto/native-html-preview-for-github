<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title description">
  <title id="title">Native HTML Preview for GitHub marquee</title>
  <desc id="description">The Markup Resolves logo on a saturated violet and magenta field</desc>
  <defs>
    <linearGradient id="brand-field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C3CE9"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#351879" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1400" height="560" fill="url(#brand-field)"/>
  <path d="M330 52 116 280l214 228" fill="none" stroke="#C9B8FF" stroke-width="76" stroke-linecap="round" stroke-linejoin="round" opacity="0.32"/>
  <circle cx="1180" cy="280" r="206" fill="#F5D0FE" opacity="0.2"/>

  <g transform="translate(540 120)" filter="url(#card-shadow)">
    <rect x="1" y="1" width="318" height="318" rx="68" fill="#FAFAF7" stroke="#E5E4DF" stroke-width="2"/>
    <path d="M125 95 60 160l65 65" fill="none" stroke="#6C3CE9" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="215" cy="160" r="58" fill="#C026D3"/>
  </g>
</svg>
