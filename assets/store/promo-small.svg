<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title description">
  <title id="title">Native HTML Preview for GitHub</title>
  <desc id="description">Chrome Web Store promotional tile with the Markup Resolves logo</desc>
  <defs>
    <linearGradient id="brand-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C3CE9"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#191919" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="440" height="280" fill="#FAFAF7"/>
  <rect width="440" height="6" fill="url(#brand-line)"/>
  <circle cx="28" cy="30" r="148" fill="#6C3CE9" opacity="0.06"/>
  <circle cx="425" cy="276" r="118" fill="#C026D3" opacity="0.07"/>

  <g transform="translate(34 76)" filter="url(#shadow)">
    <rect x="1" y="1" width="126" height="126" rx="27" fill="#FAFAF7" stroke="#E5E4DF" stroke-width="2"/>
    <path d="M50 38 24 64l26 26" fill="none" stroke="#6C3CE9" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="86" cy="64" r="23" fill="#C026D3"/>
  </g>

  <g fill="#191919" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="186" y="92" font-size="28" font-weight="700">Native HTML</text>
    <text x="186" y="128" font-size="28" font-weight="700">Preview</text>
    <text x="186" y="157" fill="#666663" font-size="18">for GitHub</text>
    <rect x="186" y="181" width="208" height="34" rx="17" fill="#F5D0FE"/>
    <text x="202" y="203" fill="#701A75" font-size="14" font-weight="600">Sandboxed · No token</text>
  </g>
</svg>
